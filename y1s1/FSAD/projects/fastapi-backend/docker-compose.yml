services:
    db:
        image: postgres:16
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASS}
            POSTGRES_DB: ${DATABASE_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_HOST: db
            DATABASE_PORT: 5432
        ports:
            - "${UVICORN_PORT}:${UVICORN_PORT}"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - /uploads:/app/uploads # Mount uploads directory for persistence

volumes:
    postgres_data:
